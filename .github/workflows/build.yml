name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordenar proyecto
        run: |
          mkdir -p app/src/main/java/com/dash/radio
          mv AndroidManifest.xml app/src/main/
          mv Core.kt MainActivity.kt app/src/main/java/com/dash/radio/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Dash-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dash (última versión)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
